<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>دليل الهندسة</title>
<meta name="description" content="وصول سريع ومنظم لجميع قروبات ومبادرات كلية الهندسة.">
<meta name="theme-color" content="#070810">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Alexandria:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
<style>
:root{
  --primary-hue:220;
  --primary-sat:90%;
  --primary-light:62%;
  --rgb-primary:61,133,255;
  --secondary-hue:calc(var(--primary-hue) + 45);

  --primary:hsl(var(--primary-hue) var(--primary-sat) var(--primary-light));
  --primary-dim:hsl(var(--primary-hue) var(--primary-sat) calc(var(--primary-light) - 12%));
  --secondary:hsl(var(--secondary-hue) calc(var(--primary-sat) - 8%) var(--primary-light));
  --grad:linear-gradient(115deg,var(--primary),var(--secondary));

  --bg:#06070f;
  --bg-image:radial-gradient(1100px 700px at 50% -12%,hsl(var(--primary-hue) 62% 22%/.5),transparent 62%),radial-gradient(900px 600px at 100% 110%,hsl(var(--secondary-hue) 55% 20%/.45),transparent 60%),linear-gradient(180deg,#080a15,#05060d 55%,#06070f);
  --grid-line:rgba(255,255,255,.032);
  --vignette:radial-gradient(ellipse 90% 70% at 50% 35%,transparent 40%,rgba(0,0,0,.55) 100%);
  --surface:rgba(20,22,32,.66);
  --surface-2:rgba(28,30,42,.55);
  --surface-3:rgba(0,0,0,.28);
  --border:rgba(255,255,255,.09);
  --border-strong:rgba(255,255,255,.16);
  --text-light:#f2f4f8;
  --text-medium:#9aa1b4;
  --shadow:0 14px 34px -22px rgba(0,0,0,.8);

  --font-body:"IBM Plex Sans Arabic",system-ui,sans-serif;
  --font-title:"Alexandria","IBM Plex Sans Arabic",sans-serif;

  --r-lg:20px;
  --r-md:14px;
  --r-sm:12px;
  --r-full:999px;
  --bar-w:430px;
  --ease:cubic-bezier(.22,1,.36,1);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{
  font-family:var(--font-body);
  background:var(--bg);
  background-image:var(--bg-image);
  background-attachment:fixed;
  color:var(--text-medium);
  direction:rtl;
  overflow-x:hidden;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
  transition:background-color .5s ease,color .5s ease;
}
body.modal-open{overflow:hidden}
a{text-decoration:none}
button{font:inherit}
*:focus-visible{outline:2px solid var(--primary);outline-offset:3px;border-radius:8px}

::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:99px}
::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.22)}

@keyframes popIn{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
@keyframes aurora1{0%{transform:translate(0,0) scale(1)}50%{transform:translate(18vw,12vh) scale(1.25)}100%{transform:translate(0,0) scale(1)}}
@keyframes aurora2{0%{transform:translate(0,0) scale(1.15)}50%{transform:translate(-22vw,-14vh) scale(1)}100%{transform:translate(0,0) scale(1.15)}}
@keyframes modalIn{from{opacity:0;transform:translateY(18px) scale(.96)}to{opacity:1;transform:none}}
@keyframes modalOut{to{opacity:0;transform:translateY(12px) scale(.96)}}

.aurora{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.aurora span{position:absolute;border-radius:50%;filter:blur(140px);opacity:.12}
.aurora span:nth-child(1){width:58vmax;height:58vmax;background:var(--primary);top:-22%;right:-18%;animation:aurora1 34s infinite alternate ease-in-out}
.aurora span:nth-child(2){width:52vmax;height:52vmax;background:var(--secondary);bottom:-26%;left:-16%;animation:aurora2 40s infinite alternate-reverse ease-in-out}
.blueprint{position:fixed;inset:0;z-index:-1;width:100%;height:100%;pointer-events:none;color:hsl(var(--primary-hue) 72% 62%);opacity:.42}
.blueprint g,.blueprint path,.blueprint circle{fill:none;stroke:currentColor;stroke-width:1;vector-effect:non-scaling-stroke}
.bp-frame{opacity:.1;stroke-dasharray:2 8}
.bp-truss{opacity:.14}
.bp-dim{opacity:.12}
.bp-compass{opacity:.14;transform-box:fill-box;transform-origin:0 100%;animation:bpSweep 26s ease-in-out infinite alternate}
.bp-gear{opacity:.16;transform-box:fill-box;transform-origin:center;animation:bpSpin 90s linear infinite}
.bp-nodes{opacity:.5}
.bp-nodes circle{fill:currentColor;stroke:none;animation:bpPulse 6s ease-in-out infinite}
.bp-nodes circle:nth-child(2){animation-delay:1.5s}
.bp-nodes circle:nth-child(3){animation-delay:3s}
.bp-nodes circle:nth-child(4){animation-delay:4.5s}
.bp-link{opacity:.22;stroke-dasharray:10 14;animation:bpFlow 24s linear infinite}
@keyframes bpSpin{to{transform:rotate(360deg)}}
@keyframes bpSweep{0%{transform:rotate(-6deg)}100%{transform:rotate(6deg)}}
@keyframes bpPulse{0%,100%{opacity:.25;r:5}50%{opacity:.9;r:7}}
@keyframes bpFlow{to{stroke-dashoffset:-480}}
.light-mode .blueprint{color:hsl(var(--primary-hue) 55% 42%);opacity:.5}
.grid-fx{position:fixed;inset:0;z-index:-1;pointer-events:none;background-image:linear-gradient(to right,var(--grid-line) 1px,transparent 1px),linear-gradient(to bottom,var(--grid-line) 1px,transparent 1px);background-size:56px 56px;-webkit-mask-image:radial-gradient(ellipse 85% 55% at 50% 0%,#000 5%,transparent 70%);mask-image:radial-gradient(ellipse 85% 55% at 50% 0%,#000 5%,transparent 70%)}
.vignette{position:fixed;inset:0;z-index:-1;pointer-events:none;background:var(--vignette)}

.wrap{min-height:100vh;padding:3rem 1.25rem 2rem}
.container{width:100%;max-width:1120px;margin:0 auto;position:relative}

.page-header{text-align:center;margin-bottom:2rem;animation:popIn .7s var(--ease) both}
.page-title{font-family:var(--font-title);font-weight:700;font-size:clamp(2.05rem,6vw,2.9rem);line-height:1.2;letter-spacing:-.015em;background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;padding-bottom:.12em}
.page-subtitle{max-width:46ch;margin:.35rem auto 0;font-size:clamp(.92rem,2.2vw,1rem);color:var(--text-medium)}

.filters{display:flex;flex-direction:column;align-items:stretch;gap:.7rem;margin-bottom:2.25rem;animation:popIn .7s var(--ease) .12s both}
.seg-scroll{display:flex;justify-content:center;width:100%}
.seg{position:relative;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:5px;width:100%;max-width:var(--bar-w);padding:5px;border-radius:22px;background:var(--surface-2);border:1px solid var(--border);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:var(--shadow)}
.seg-thumb{position:absolute;top:0;left:0;width:0;height:0;border-radius:var(--r-full);background:var(--grad);box-shadow:0 6px 16px -10px rgba(var(--rgb-primary),.7);transition:transform .45s var(--ease),width .45s var(--ease),height .45s var(--ease);opacity:0}
.seg-thumb.ready{opacity:1}
.seg-btn{position:relative;z-index:1;flex:1 1 auto;min-width:0;border:0;background:none;cursor:pointer;white-space:nowrap;font-weight:600;font-size:clamp(.86rem,3.2vw,1rem);color:var(--text-medium);padding:.6rem clamp(.7rem,3vw,1.25rem);border-radius:var(--r-full);transition:color .35s ease}
.seg-btn:hover{color:var(--text-light)}
.seg-btn.is-active{color:#fff}
.seg--sm .seg-btn{flex:1 1 0;min-width:0;font-size:clamp(.8rem,2.9vw,.92rem);padding:.5rem clamp(.5rem,2vw,.9rem)}
.seg-break{flex:0 0 100%;height:0;margin:0;padding:0}
.level-row{display:none}
.level-row.is-visible{display:block;animation:popIn .45s var(--ease) both}

.links-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(330px,100%),1fr));gap:1.15rem;align-items:start}
.link-card{position:relative;overflow:hidden;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:1.35rem 1.35rem 1.45rem;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:var(--shadow);transition:transform .45s var(--ease),border-color .35s ease,box-shadow .45s var(--ease)}
.link-card::after{content:'';position:absolute;inset:0;background:radial-gradient(130% 100% at 18% -15%,hsl(var(--primary-hue) var(--primary-sat) var(--primary-light)/.14),transparent 62%);opacity:0;transition:opacity .45s ease;pointer-events:none}
.link-card:hover::after{opacity:1}
.link-card:hover{transform:translateY(-3px);border-color:hsl(var(--primary-hue) var(--primary-sat) var(--primary-light)/.32);box-shadow:0 20px 44px -26px rgba(0,0,0,.85)}
.link-card.span-full{grid-column:1/-1}
.is-filtered-out{display:none!important}
.is-showing{animation:popIn .55s var(--ease) both;animation-delay:var(--order,0s)}

.card-head{display:flex;align-items:center;gap:.85rem;padding-bottom:1rem;margin-bottom:1.15rem;border-bottom:1px solid var(--border)}
.card-ico{flex:0 0 auto;width:44px;height:44px;border-radius:13px;display:grid;place-items:center;font-size:1.15rem;font-weight:700;font-family:var(--font-title);color:var(--primary);background:hsl(var(--primary-hue) var(--primary-sat) var(--primary-light)/.13);border:1px solid hsl(var(--primary-hue) var(--primary-sat) var(--primary-light)/.2)}
.card-head-txt{flex:1;display:flex;flex-direction:column;gap:.25rem;min-width:0}
.card-title{font-family:var(--font-title);font-weight:600;font-size:1.14rem;letter-spacing:-.01em;color:var(--text-light);line-height:1.35}
.card-badge{align-self:flex-start;font-size:.74rem;font-weight:600;color:var(--text-medium);border:1px solid var(--border);padding:.1rem .55rem;border-radius:var(--r-full)}

.sec-title{font-size:.85rem;font-weight:600;color:var(--text-medium);display:flex;align-items:center;gap:.5rem;margin:1.25rem 0 .75rem}
.sec-title::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--border),transparent)}
.sec-block:first-child .sec-title{margin-top:0}
.sec-title i{color:var(--primary);font-size:.8rem}
.btn-group{display:flex;flex-direction:column;gap:.5rem}
.btn-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(230px,100%),1fr));gap:.5rem}

.link-button{flex:1;min-width:0;display:flex;align-items:center;gap:.85rem;padding:0;background:none;border:0}
.link-button .lb-ico{flex:0 0 auto;width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font-size:.88rem;color:var(--primary);background:hsl(var(--primary-hue) var(--primary-sat) var(--primary-light)/.12);transition:background .3s ease,color .3s ease}
.link-button .lb-text{flex:1;min-width:0;font-weight:600;font-size:.94rem;color:var(--text-light);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb-sub{display:block;font-size:.72rem;font-weight:600;color:var(--text-medium);opacity:.9;overflow:hidden;text-overflow:ellipsis}
.link-row:hover .lb-ico{background:var(--primary);color:#fff}

.dept-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(260px,100%),340px));justify-content:center;gap:.85rem}
.dept{position:relative;border:1px solid var(--border);border-radius:var(--r-md);padding:1rem;background:linear-gradient(180deg,hsl(var(--primary-hue) var(--primary-sat) var(--primary-light)/.07),transparent 60%),var(--surface-3);transition:border-color .35s ease,transform .35s var(--ease)}
.dept:hover{border-color:hsl(var(--primary-hue) var(--primary-sat) var(--primary-light)/.3)}
.dept-title{display:flex;align-items:center;gap:.55rem;font-family:var(--font-title);font-weight:600;font-size:.98rem;color:var(--text-light);padding-bottom:.75rem;margin-bottom:.8rem;border-bottom:1px solid var(--border)}
.dept-title i{flex:0 0 auto;color:var(--primary);font-size:.85rem}
.card-sep{border:0;height:1px;background:var(--border);margin:1.25rem 0}

.empty-state{grid-column:1/-1;display:none;flex-direction:column;align-items:center;gap:1rem;text-align:center;padding:3.5rem 1.5rem;color:var(--text-light);animation:popIn .5s var(--ease) both}
.empty-state.is-visible{display:flex}
.empty-state i{width:64px;height:64px;border-radius:18px;display:grid;place-items:center;font-size:1.5rem;color:var(--primary);background:hsl(var(--primary-hue) var(--primary-sat) var(--primary-light)/.12);border:1px solid hsl(var(--primary-hue) var(--primary-sat) var(--primary-light)/.18)}
.empty-state span{font-weight:700}
.ghost-btn{display:inline-flex;align-items:center;gap:.5rem;padding:.6rem 1.4rem;border-radius:var(--r-full);border:1px solid var(--border-strong);background:var(--surface-3);color:var(--text-light);font-weight:600;cursor:pointer;transition:.3s var(--ease)}
.ghost-btn:hover{border-color:var(--primary);background:hsl(var(--primary-hue) var(--primary-sat) var(--primary-light)/.12)}

.page-footer{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:1rem;margin-top:3rem;padding-top:1.5rem;border-top:1px solid var(--border);font-size:.9rem;animation:popIn .7s var(--ease) .3s both}
.footer-credit{display:inline-flex;align-items:center;gap:.5rem;font-weight:700;color:var(--text-medium)}
.footer-controls{display:flex;align-items:center;gap:1.25rem}
.icon-btn{width:42px;height:42px;border-radius:50%;display:inline-grid;place-items:center;border:0;background:transparent;color:var(--text-medium);font-size:1.3rem;cursor:pointer;transition:color .3s ease,background-color .3s ease,transform .3s var(--ease)}
.icon-btn:hover{color:var(--primary);background:hsl(var(--primary-hue) var(--primary-sat) var(--primary-light)/.1);transform:scale(1.1)}
.icon-btn svg{width:1em;height:1em}

.to-top{position:fixed;bottom:1.25rem;left:1.25rem;z-index:900;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--border-strong);background:var(--surface);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);color:var(--text-light);font-size:1rem;cursor:pointer;opacity:0;visibility:hidden;transform:translateY(14px);transition:.4s var(--ease);box-shadow:var(--shadow)}
.to-top.is-visible{opacity:1;visibility:visible;transform:none}
.to-top.is-parked{opacity:0;visibility:hidden;transform:translateY(14px)}
.to-top:hover{color:#fff;background:var(--grad);border-color:transparent}
.search-box{display:flex;align-items:center;gap:.6rem;width:100%;max-width:var(--bar-w);margin-inline:auto;padding:.6rem 1rem;border-radius:var(--r-full);background:var(--surface-2);border:1px solid var(--border);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:var(--shadow);transition:border-color .3s ease,box-shadow .3s ease}
.search-box:focus-within{border-color:hsl(var(--primary-hue) var(--primary-sat) var(--primary-light)/.5);box-shadow:0 0 0 3px hsl(var(--primary-hue) var(--primary-sat) var(--primary-light)/.12)}
.search-box>i{color:var(--text-medium);font-size:.95rem}
.search-box input{flex:1;min-width:0;border:0;background:none;outline:none;color:var(--text-light);font:inherit;font-size:.95rem}
.search-box input::placeholder{color:var(--text-medium);opacity:.75}
.search-box input::-webkit-search-cancel-button{display:none}
.search-clear{display:none;border:0;background:none;color:var(--text-medium);font-size:1rem;cursor:pointer;transition:color .3s ease}
.search-clear:hover{color:var(--text-light)}
.search-box.has-value .search-clear{display:block}
.filters.is-searching .seg-scroll,.filters.is-searching .level-row{display:none}
.is-hidden{display:none!important}
.link-row{display:flex;align-items:center;gap:.35rem;padding:.6rem .7rem;border-radius:var(--r-sm);background:var(--surface-3);border:1px solid var(--border);transition:transform .3s var(--ease),background-color .3s ease,border-color .3s ease}
.link-row:hover{transform:translateY(-2px);border-color:hsl(var(--primary-hue) var(--primary-sat) var(--primary-light)/.45);background:hsl(var(--primary-hue) var(--primary-sat) var(--primary-light)/.08)}
.fav-btn{flex:0 0 auto;width:30px;height:30px;border-radius:10px;display:grid;place-items:center;border:0;background:none;color:var(--text-medium);font-size:.85rem;opacity:.45;cursor:pointer;transition:.3s var(--ease)}
.fav-btn:hover{opacity:1;color:var(--primary);background:hsl(var(--primary-hue) var(--primary-sat) var(--primary-light)/.14)}
.fav-btn.is-active{opacity:1;color:var(--primary)}
.share-btn{flex:0 0 auto;width:30px;height:30px;border-radius:10px;display:grid;place-items:center;border:0;background:none;color:var(--text-medium);font-size:.85rem;opacity:.45;cursor:pointer;transition:.3s var(--ease)}
.share-btn:hover{opacity:1;color:var(--primary);background:hsl(var(--primary-hue) var(--primary-sat) var(--primary-light)/.14)}
.toast{position:fixed;bottom:1.4rem;left:50%;z-index:1200;padding:.7rem 1.25rem;border-radius:var(--r-full);background:var(--surface);border:1px solid var(--border-strong);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);color:var(--text-light);font-weight:600;font-size:.9rem;box-shadow:var(--shadow);opacity:0;visibility:hidden;transform:translate(-50%,16px);transition:.35s var(--ease)}
.toast.is-visible{opacity:1;visibility:visible;transform:translate(-50%,0)}
.modal-overlay{position:fixed;inset:0;background:rgba(4,5,10,.6);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);z-index:1000;display:flex;align-items:center;justify-content:center;padding:1.25rem;opacity:0;transition:opacity .35s ease}
.modal-overlay.is-open{opacity:1}
.modal-content{position:relative;width:100%;max-width:440px;background:var(--surface);border:1px solid var(--border-strong);border-radius:var(--r-lg);padding:1.75rem;backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);box-shadow:var(--shadow);animation:modalIn .4s var(--ease) both;max-height:88vh;overflow-y:auto}
.modal-content.is-closing{animation:modalOut .28s ease-out forwards}
.modal-close{position:absolute;top:1rem;left:1rem;width:36px;height:36px;border-radius:50%;border:1px solid var(--border);background:var(--surface-3);color:var(--text-medium);font-size:1rem;cursor:pointer;display:grid;place-items:center;transition:.3s var(--ease)}
.modal-close:hover{color:var(--text-light);transform:rotate(90deg)}
.modal-header{font-family:var(--font-title);font-weight:600;font-size:1.25rem;color:var(--text-light);padding:0 0 1rem 2.75rem;margin-bottom:1.25rem;border-bottom:1px solid var(--border)}

.set-group{display:flex;flex-direction:column;gap:1.1rem}
.set-row{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap}
.set-row h4{font-size:.98rem;font-weight:600;color:var(--text-light)}
.mode-toggle{display:flex;gap:4px;padding:4px;border-radius:var(--r-full);background:var(--surface-3);border:1px solid var(--border)}
.mode-btn{padding:.4rem 1rem;border:0;border-radius:var(--r-full);background:none;color:var(--text-medium);font-weight:600;font-size:.9rem;cursor:pointer;transition:.3s ease}
.mode-btn.active{background:var(--grad);color:#fff}
.theme-picker{display:flex;align-items:center;gap:.5rem}
.theme-dot{width:26px;height:26px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:transform .2s ease,border-color .2s ease}
.theme-dot:hover{transform:scale(1.15)}
.theme-dot.active{border-color:var(--text-light);transform:scale(1.1)}
.color-label{position:relative;width:26px;height:26px;border-radius:50%;overflow:hidden;cursor:pointer;border:2px dashed var(--border-strong);transition:transform .2s ease,border-color .2s ease}
.color-label:hover{transform:scale(1.15)}
.color-label.active{border-style:solid;border-color:var(--text-light)}
.color-label input{position:absolute;inset:0;width:100%;height:100%;opacity:0;border:0;padding:0;cursor:pointer}

.light-mode{
  --bg:#eef3fb;
  --surface:rgba(255,255,255,.86);
  --surface-2:rgba(255,255,255,.72);
  --surface-3:hsl(var(--primary-hue) 60% 50%/.06);
  --border:hsl(var(--primary-hue) 45% 45%/.16);
  --border-strong:hsl(var(--primary-hue) 45% 45%/.28);
  --text-light:#131a2a;
  --text-medium:#5d6880;
  --primary-light:52%;
  --shadow:0 18px 40px -24px rgba(35,60,110,.45);
}
.light-mode{--bg-image:radial-gradient(1000px 650px at 50% -10%,hsl(var(--primary-hue) 85% 88%/.9),transparent 60%),radial-gradient(800px 600px at 100% 105%,hsl(var(--secondary-hue) 80% 90%/.85),transparent 58%),linear-gradient(180deg,#f3f7fe,#e9effa 60%,#eef3fb);--grid-line:hsl(var(--primary-hue) 45% 40%/.06);--vignette:radial-gradient(ellipse 95% 75% at 50% 35%,transparent 55%,hsl(var(--primary-hue) 40% 60%/.16) 100%)}
.light-mode .aurora span{opacity:.28;filter:blur(150px)}
.light-mode .modal-overlay{background:rgba(120,140,180,.25)}
.light-mode .dept{background:linear-gradient(180deg,hsl(var(--primary-hue) var(--primary-sat) var(--primary-light)/.06),transparent 60%),#fff}

@media (max-width:520px){
  .wrap{padding:2.25rem 1rem 1.5rem}
  .link-card{padding:1.25rem}
  .page-footer{flex-wrap:nowrap;justify-content:space-between;gap:.5rem}
  .footer-credit{font-size:.85rem}
  .footer-controls{gap:.5rem}
}
@media (hover:none){
  .link-card:hover{transform:none;border-color:var(--border);box-shadow:var(--shadow)}
  .link-card:hover::after{opacity:0}
  .link-card:hover .card-ico{transform:none}
  .link-card:hover .card-ico i{transform:none}
  .link-row:hover{transform:none;background:var(--surface-3);border-color:var(--border)}
  .link-row:hover .lb-ico{background:hsl(var(--primary-hue) var(--primary-sat) var(--primary-light)/.12);color:var(--primary)}
  .dept:hover{border-color:var(--border)}
  .link-row:active{transform:scale(.98)}
  .link-row:active .lb-ico{background:var(--primary);color:#fff}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;transition-duration:.01ms!important}
}

        { href:'https://t.me/addlist/e45MNymbK-0xYzA0', icon:'fa-infinity', text:'مستديم · مدني' } ] },
      departments:[
        { title:"الهندسة الكهربائية", icon:"fa-bolt", links:[ { href:"https://t.me/EELevel7Qu", icon:"fa-bullhorn", text:"القناة" }, { href:"https://t.me/EELevel7", icon:"fa-comments", text:"القروب" } ] } ] }
  ];

  const PRIMARY_FILTERS = [ {id:'all',text:'الكل'}, {id:'college',text:'الكلية'}, {id:'specializations',text:'التخصصات'}, {id:'levels',text:'المستويات'} ];
  const LEVEL_FILTERS = [ {id:'level-1',text:'الأول'}, {id:'level-2',text:'الثاني'}, {id:'level-3',text:'الثالث'}, {id:'level-4',text:'الرابع'}, {id:'level-5',text:'الخامس'}, {id:'level-6',text:'السادس'}, {id:'level-7',text:'السابع'} ];
  const PRESET_THEMES = { blue:'#3d85ff', teal:'#12b5a5', purple:'#a777ff', green:'#00c853', amber:'#f5a524' };

  const grid = document.getElementById('links-grid');
  const emptyState = document.getElementById('empty-state');
  const levelRow = document.getElementById('level-row');
  let activePrimary = 'all', activeLevel = LEVEL_FILTERS[0].id;

  const normalize = t => (t || '').toString().toLowerCase()
    .replace(/[\u064B-\u0652\u0640]/g, '')
    .replace(/[\u0623\u0625\u0622\u0671]/g, '\u0627')
    .replace(/\u0649/g, '\u064a').replace(/\u0624/g, '\u0648')
    .replace(/\u0626/g, '\u064a').replace(/\u0629/g, '\u0647')
    .replace(/[\u0660-\u0669]/g, d => String(d.charCodeAt(0) - 0x0660))
    .replace(/[\u06F0-\u06F9]/g, d => String(d.charCodeAt(0) - 0x06F0))
    .replace(/\s+/g, ' ').trim();

  const buttonsHTML = (links, wrapClass) => `<div class="${wrapClass}">${links.map(l =>
    `<div class="link-row" data-search="${normalize(l.text)}"><a href="${l.href}" target="_blank" rel="noopener noreferrer" class="link-button"><span class="lb-ico"><i class="fas ${l.icon}"></i></span><span class="lb-text">${l.text}${l.sub ? `<small class="lb-sub">${l.sub}</small>` : ''}</span></a><button class="fav-btn" type="button" data-href="${l.href}" data-title="${l.text}" data-icon="${l.icon}" title="تثبيت الرابط" aria-label="تثبيت الرابط"><i class="fas fa-bookmark"></i></button><button class="share-btn" type="button" data-href="${l.href}" data-title="${l.text}" title="مشاركة الرابط" aria-label="مشاركة الرابط"><i class="fas fa-share-nodes"></i></button></div>`
  ).join('')}</div>`;

  const cardSearchText = data => {
    let parts = [data.title, data.badge];
    if (data.links) parts = parts.concat(data.links.map(l => l.text));
    if (data.sections) data.sections.forEach(sec => { parts.push(sec.title); parts = parts.concat(sec.links.map(l => l.text)); });
    if (data.initiatives) { parts.push(data.initiatives.title); parts = parts.concat(data.initiatives.links.map(l => l.text)); }
    if (data.departments) data.departments.forEach(d => { parts.push(d.title); parts = parts.concat(d.links.map(l => l.text)); });

    if (num) parts.push(`${num} المستوى ${num} لفل ${num} مستوى${num}`);
    return normalize(parts.filter(Boolean).join(' '));
  };

  const createCardHTML = (data, index) => {
    const badge = data.badge ? `<span class="card-badge">${data.badge}</span>` : '';
    const head = `<div class="card-head"><span class="card-ico"><i class="fas ${data.icon}"></i></span><div class="card-head-txt"><h2 class="card-title">${data.title}</h2>${badge}</div></div>`;
    let body = '';
    if (data.links) body = buttonsHTML(data.links, 'btn-group');
    else if (data.sections) body = data.sections.map(sec =>
      `<div class="sec-block"><h3 class="sec-title"><i class="fas ${sec.icon}"></i>${sec.title}</h3>${buttonsHTML(sec.links, 'btn-group')}</div>`).join('');
    else if (data.type === 'multi') {
      const inits = data.initiatives
        ? `<div class="sec-block"><h3 class="sec-title"><i class="fas ${data.initiatives.icon}"></i>${data.initiatives.title}</h3>${buttonsHTML(data.initiatives.links, 'btn-grid')}<hr class="card-sep"></div>`
        : '';
      const depts = data.departments.map(d =>
        `<div class="dept"><h4 class="dept-title"><i class="fas ${d.icon}"></i>${d.title}</h4>${buttonsHTML(d.links, 'btn-group')}</div>`).join('');
      body = `${inits}<div class="dept-grid">${depts}</div>`;
    }
    const full = data.type === 'multi' ? 'span-full' : '';
    return `<section class="link-card is-filtered-out ${full}" data-category="${data.category}" data-level="${data.level}" data-search="${cardSearchText(data)}" style="--order:${index * 55}ms">${head}${body}</section>`;
  };

  let searchQuery = '';

  const filterContent = () => {
    const cards = Array.from(grid.querySelectorAll('.link-card'));
    let visible = 0;
    cards.forEach(card => {
      let show;
      if (searchQuery) {
        const titleHit = card.dataset.search.includes(searchQuery);
        let hits = 0;
        card.querySelectorAll('.link-row').forEach(row => {
          const on = titleHit || row.dataset.search.includes(searchQuery);
          row.classList.toggle('is-hidden', !on);
          if (on) hits++;
        });
        card.querySelectorAll('.sec-block, .dept').forEach(block =>
          block.classList.toggle('is-hidden', !block.querySelector('.link-row:not(.is-hidden)')));
        show = hits > 0;
      } else {
        card.querySelectorAll('.is-hidden').forEach(el => el.classList.remove('is-hidden'));
        if (card.dataset.category === 'pinned') show = true;
        else if (activePrimary === 'all') show = true;
        else if (activePrimary === 'levels') show = card.dataset.category === 'levels' && card.dataset.level === activeLevel;
        else show = card.dataset.category === activePrimary;
      }
      card.classList.remove('is-showing');
      card.classList.toggle('is-filtered-out', !show);
      if (show) { card.style.setProperty('--order', `${visible * 55}ms`); visible++; }
    });
    requestAnimationFrame(() => {
      cards.forEach(c => { if (!c.classList.contains('is-filtered-out')) c.classList.add('is-showing'); });
    });
    emptyState.classList.toggle('is-visible', visible === 0);
    emptyState.querySelector('span').textContent = searchQuery ? 'ما لقينا نتائج لبحثك.' : 'لا توجد نتائج تطابق هذا التصنيف.';
  };

  const createSegment = (scrollId, segId, filters, onChange, breakAfter) => {
    const seg = document.getElementById(segId);
    const thumb = seg.querySelector('.seg-thumb');
    seg.insertAdjacentHTML('beforeend', filters.map((f, i) =>
      `<button class="seg-btn" type="button" data-id="${f.id}" aria-pressed="false">${f.text}</button>${breakAfter && i === breakAfter - 1 ? '<span class="seg-break"></span>' : ''}`).join(''));
    const buttons = Array.from(seg.querySelectorAll('.seg-btn'));
    const ro = 'ResizeObserver' in window ? new ResizeObserver(() => moveThumb(false)) : null;

    const moveThumb = animate => {
      const active = seg.querySelector('.seg-btn.is-active');
      if (!active || !active.offsetWidth) return;
      thumb.style.transition = animate ? '' : 'none';
      thumb.style.width = `${active.offsetWidth}px`;
      thumb.style.height = `${active.offsetHeight}px`;
      thumb.style.transform = `translate(${active.offsetLeft - seg.clientLeft}px, ${active.offsetTop - seg.clientTop}px)`;
      thumb.classList.add('ready');
      if (!animate) requestAnimationFrame(() => { thumb.style.transition = ''; });
    };

    const select = (id, fire, animate = true) => {
      const target = buttons.find(b => b.dataset.id === id) || buttons[0];
      buttons.forEach(b => { const on = b === target; b.classList.toggle('is-active', on); b.setAttribute('aria-pressed', String(on)); });
      moveThumb(animate);
      if (fire) onChange(target.dataset.id);
    };

    buttons.forEach(b => b.addEventListener('click', () => select(b.dataset.id, true)));
    if (ro) ro.observe(seg);
    window.addEventListener('resize', () => moveThumb(false));
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => moveThumb(false));
    return { select, refresh: () => moveThumb(false) };
  };

  const openOverlay = modal => { modal.style.display = 'flex'; requestAnimationFrame(() => { document.body.classList.add('modal-open'); modal.classList.add('is-open'); }); };

    if (!modal.classList.contains('is-open')) return;
    const content = modal.querySelector('.modal-content');
    document.body.classList.remove('modal-open');
    content.classList.add('is-closing');
    content.addEventListener('animationend', () => { modal.classList.remove('is-open'); content.classList.remove('is-closing'); modal.style.display = 'none'; }, { once:true });

        <div class="modal-content">
          <button class="modal-close" id="settings-close" aria-label="إغلاق"><i class="fas fa-xmark"></i></button>

            <div class="set-row">

                <button class="mode-btn" data-mode="dark" type="button">ظلام</button>

              <div class="theme-picker">
                ${Object.entries(PRESET_THEMES).map(([n,c]) => `<div class="theme-dot" data-color="${c}" style="background:${c}" title="${n}"></div>`).join('')}
                <label class="color-label" title="لون مخصص"><input type="color" id="custom-color"></label>
              </div>
            </div>
          </div>
        </div>
      </div>`;

    const modal = document.getElementById('settings-modal');
    document.getElementById('settings-btn').onclick = () => openOverlay(modal);
    document.getElementById('settings-close').onclick = () => closeOverlay(modal);
    modal.addEventListener('click', e => { if (e.target === modal) closeOverlay(modal); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeOverlay(modal); });

    const modeBtns = modal.querySelectorAll('.mode-btn');
    const applyMode = mode => {
      document.body.classList.toggle('light-mode', mode === 'light');
      document.querySelector('meta[name="theme-color"]').setAttribute('content', mode === 'light' ? '#eef3fb' : '#070810');
      localStorage.setItem('eng-portal-mode', mode);
      modeBtns.forEach(b => b.classList.toggle('active', b.dataset.mode === mode));
    };
    modeBtns.forEach(b => b.onclick = () => applyMode(b.dataset.mode));

    const dots = modal.querySelectorAll('.theme-dot');
    const colorInput = document.getElementById('custom-color');
    const colorLabel = colorInput.parentElement;
    const hexToHue = H => { let r=parseInt(H.slice(1,3),16)/255,g=parseInt(H.slice(3,5),16)/255,b=parseInt(H.slice(5,7),16)/255;
      const mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn; let h=0;
      if(d!==0){ if(mx===r)h=((g-b)/d)%6; else if(mx===g)h=(b-r)/d+2; else h=(r-g)/d+4; }
      h=Math.round(h*60); return h<0?h+360:h; };
    const hexToRgb = hex => `${parseInt(hex.slice(1,3),16)},${parseInt(hex.slice(3,5),16)},${parseInt(hex.slice(5,7),16)}`;
    const applyTheme = hex => {
      document.documentElement.style.setProperty('--primary-hue', String(hexToHue(hex)));
      document.documentElement.style.setProperty('--rgb-primary', hexToRgb(hex));
      localStorage.setItem('eng-portal-theme', hex);
      colorInput.value = hex;
      const custom = !Object.values(PRESET_THEMES).includes(hex);
      dots.forEach(d => d.classList.toggle('active', d.dataset.color === hex));
      colorLabel.classList.toggle('active', custom);
      colorLabel.style.background = custom ? hex : 'transparent';
    };
    dots.forEach(d => d.onclick = () => applyTheme(d.dataset.color));
    colorInput.addEventListener('input', e => applyTheme(e.target.value));

    applyMode(localStorage.getItem('eng-portal-mode') || 'dark');
    applyTheme(localStorage.getItem('eng-portal-theme') || PRESET_THEMES.blue);
  };

  const toastEl = document.getElementById('toast');
  let toastTimer;
  const toast = msg => {
    toastEl.textContent = msg;
    toastEl.classList.add('is-visible');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('is-visible'), 2200);
  };

  const copyFallback = text => {
    const area = document.createElement('textarea');
    area.value = text; area.style.position = 'fixed'; area.style.opacity = '0';
    document.body.appendChild(area); area.select();
    try { document.execCommand('copy'); toast('تم نسخ الرابط'); } catch (e) { toast('تعذر نسخ الرابط'); }
    document.body.removeChild(area);
  };

  const shareLink = btn => {
    const url = btn.dataset.href, title = btn.dataset.title;
    if (navigator.share) { navigator.share({ title, url }).catch(() => {}); return; }
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(url).then(() => toast('تم نسخ الرابط')).catch(() => copyFallback(url));
    } else copyFallback(url);
  };

  const toTop = document.getElementById('to-top');
  toTop.onclick = () => window.scrollTo({ top:0, behavior:'smooth' });
  window.addEventListener('scroll', () => toTop.classList.toggle('is-visible', window.scrollY > 420), { passive:true });
  const footerEl = document.querySelector('.page-footer');
  if (footerEl && 'IntersectionObserver' in window) {
    new IntersectionObserver(entries => toTop.classList.toggle('is-parked', entries[0].isIntersecting), { rootMargin:'0px 0px -20px 0px' }).observe(footerEl);
  }

  document.getElementById('currentYear').textContent = new Date().getFullYear();
  document.querySelector('.icon-btn[href*="t.me/mutlaq1"]').innerHTML = TELEGRAM_SVG;
  grid.insertAdjacentHTML('beforeend', SITE_DATA.map(createCardHTML).join(''));

  let levelSeg;
  const primarySeg = createSegment('primary-scroll', 'primary-seg', PRIMARY_FILTERS, id => {
    activePrimary = id;
    const isLevels = id === 'levels';
    levelRow.classList.toggle('is-visible', isLevels);
    if (isLevels && levelSeg) requestAnimationFrame(() => levelSeg.refresh());
    filterContent();
  });
  levelSeg = createSegment('level-scroll', 'level-seg', LEVEL_FILTERS, id => {
    activeLevel = id;
    if (activePrimary === 'levels') filterContent();
  }, 5);

  const searchBox = document.getElementById('search-box');
  const searchInput = document.getElementById('search-input');
  const filtersEl = document.getElementById('filters');
  const runSearch = () => {
    searchQuery = normalize(searchInput.value);
    searchBox.classList.toggle('has-value', searchInput.value.length > 0);
    filtersEl.classList.toggle('is-searching', searchQuery.length > 0);
    filterContent();
  };
  searchInput.addEventListener('input', runSearch);
  document.getElementById('search-clear').onclick = () => { searchInput.value = ''; runSearch(); searchInput.focus(); };

  const FAV_KEY = 'eng-portal-favs';
  let favs = [];
  try { favs = JSON.parse(localStorage.getItem(FAV_KEY)) || []; } catch (e) { favs = []; }

  const renderFavs = () => {
    let card = document.getElementById('fav-card');
    if (!favs.length) { if (card) card.remove(); return; }
    const links = favs.map(f => ({ href:f.h, text:f.t, icon:f.i, sub:f.s }));
    const body = `<div class="card-head"><span class="card-ico"><i class="fas fa-bookmark"></i></span><div class="card-head-txt"><h2 class="card-title">المثبتات</h2><span class="card-badge">${favs.length} رابط</span></div></div>${buttonsHTML(links, 'btn-grid')}`;
    if (!card) {
      card = document.createElement('section');
      card.id = 'fav-card';
      card.className = 'link-card span-full';
      card.dataset.category = 'pinned';
      card.dataset.level = 'pinned';
      grid.insertBefore(card, grid.firstChild);
    }
    card.dataset.search = normalize(['المثبتات', ...favs.map(f => `${f.t} ${f.s || ''}`)].join(' '));
    card.innerHTML = body;
    refreshFavs();
  };

  const refreshFavs = () => document.querySelectorAll('.fav-btn').forEach(b => {
    const on = favs.some(f => f.h === b.dataset.href);
    b.classList.toggle('is-active', on);
    b.title = on ? 'إلغاء التثبيت' : 'تثبيت الرابط';
  });

  grid.addEventListener('click', e => {
    const fav = e.target.closest('.fav-btn');
    if (fav) {
      const href = fav.dataset.href;
      const exists = favs.some(f => f.h === href);
      const host = fav.closest('.link-card');
      const dept = fav.closest('.dept');
      const cardTitle = host && host.id !== 'fav-card' ? host.querySelector('.card-title').textContent.trim() : '';
      const deptTitle = dept ? dept.querySelector('.dept-title').textContent.trim() : '';
      const source = [cardTitle, deptTitle].filter(Boolean).join(' · ');
      favs = exists ? favs.filter(f => f.h !== href) : favs.concat({ h:href, t:fav.dataset.title, i:fav.dataset.icon, s:source });
      localStorage.setItem(FAV_KEY, JSON.stringify(favs));
      renderFavs();
      refreshFavs();
      filterContent();
      toast(exists ? 'أُزيل من المثبتات' : 'تم إضافته للمثبتات');
      return;
    }
    const share = e.target.closest('.share-btn');
    if (share) shareLink(share);
  });

  document.getElementById('reset-filter-btn').onclick = () => {
    searchInput.value = '';
    runSearch();
    primarySeg.select('all', true);
  };

  initSettings();
  renderFavs();
  primarySeg.select('all', false, false);
  levelSeg.select(activeLevel, false, false);
  filterContent();
  window.addEventListener('load', () => { primarySeg.refresh(); levelSeg.refresh(); });
});
</script>
</body>
</html>
